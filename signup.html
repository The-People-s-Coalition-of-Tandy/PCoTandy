<!DOCTYPE html>
<html>

<head>
    <link rel="stylesheet" href="signup.css">
    <title>PCoT Sign Up</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" href="./Assets/PCoTandyLogo.ico">
    <!-- makes the lights at home glow (see lights/server/glow.py) -->
    <script defer src="https://lights.julipode.net/glow/beacon.js" data-site="pcotandy"></script>
</head>

<body>

    <main>
            <h1>Sign Up </h1>
            <div class="feedback-form">
                <!-- Kit form 10111350; Kit's form settings redirect to /signup-success after subscribing -->
                <form action="https://app.kit.com/forms/10111350/subscriptions" method="post">


                    <div class="field">
                        <label for="email">Email</label><br>
                        <input type="email" name="email_address" id="email" required placeholder="Email">
                    </div><br>

                    <div class="field">
                        <label for="username">Username</label><br>
                        <input type="text" name="fields[username]" id="username" required placeholder="Username">
                    </div>
<br>
                    <input type="submit" value="Submit" class="submit-button">
                </form>
            </div>
        </main>

</body>

</html>
